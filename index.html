<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>準備中</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #2b2b2b; --sub: #6b6b6b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #ececec; --sub: #a0a0a0; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; text-align: center; padding: 0 16px; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .5rem; }
  p { margin: 0; color: var(--sub); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>準備中</h1>
  <p>このページは現在準備中です。</p>
</main>
</body>
</html>
